[project]
name = "technical-test-backend"
version = "0.1.0"
description = "Modular backend interview exercises"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=4.0.1,<4.1",
    "fastapi>=0.141.1",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["src", "tests"]
addopts = "--import-mode=importlib"
