name: Package unstable build

# Every push to main: rebuild the internal snapshot with ALL exercises and publish it as the
# "unstable" release. It goes through tools/exercises.py, so the .gitattributes denylist, pruning,
# README handling, leak check and zip verification all apply. Internal testing only.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: package-unstable
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python tools/exercises.py build --set all --out dist
      - name: Publish / update "unstable" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Auto-built from ${GITHUB_SHA:0:7} at $(date -u +%Y-%m-%dT%H:%M:%SZ). Internal testing only; not what candidates receive."
          if gh release view unstable >/dev/null 2>&1; then
            gh release upload unstable dist/technical-test-backend.zip --clobber
            gh release edit unstable --notes "$notes"
          else
            gh release create unstable dist/technical-test-backend.zip --title "Unstable (internal)" --notes "$notes" --prerelease
          fi
