name: Build candidate zip

# Manual: builds and verifies a zip and attaches it to the run for 7 days. Nothing is published.
# Give a track (random pick) OR explicit slugs, then download the artifact and send it to the candidate.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Track to pick at random: 20 or 60. Leave empty to use the slugs below."
        type: choice
        options: ["", "20", "60"]
        default: ""
      exercises:
        description: "Comma-separated slugs (hyphens are accepted), used when no track is chosen"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Build
        env:
          TRACK: ${{ inputs.track }}
          EXERCISES: ${{ inputs.exercises }}
        run: |
          if [ -n "$TRACK" ]; then
            uv run python tools/exercises.py build --track "$TRACK" --out dist
          elif [ -n "$EXERCISES" ]; then
            uv run python tools/exercises.py build --set "$EXERCISES" --out dist
          else
            echo "Give a track or a list of slugs" >&2; exit 1
          fi
          echo "### Built set" >> "$GITHUB_STEP_SUMMARY"; cat dist/build.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-zip
          path: dist/
          retention-days: 7
